<style>
        body {
            background-color: #0b0f19;
            overflow: hidden;
            touch-action: none;
        }
        .snake-glow {
            filter: drop-shadow(0 0 8px rgba(78, 222, 163, 0.6));
        }
        .fruit-glow {
            filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.8));
        }
        .grid-pattern {
            background-size: 32px 32px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(78, 222, 163, 0.1);
            position: absolute;
            top: 0;
            z-index: 10;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .d-pad-active:active {
            transform: scale(0.92);
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        }
    </style>

<body class="font-body-md text-on-surface select-none overflow-hidden">
<!-- Background Shader Layer -->
<div class="fixed inset-0 z-0 opacity-40">

</div>
<!-- Scanline Effect -->
<div class="scanline pointer-events-none"></div>
<!-- Top App Bar / HUD -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/40 border-b border-white/10 h-16 flex justify-between items-center px-margin-mobile shadow-[0_0_20px_rgba(78,222,163,0.2)]">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-primary/70 tracking-widest">SYSTEM_STATUS</span>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary tracking-tighter">NEON_SYNAPSE_v1.0</h1>
</div>
<div class="flex items-center gap-4">
<div class="text-right">
<p class="font-label-caps text-[10px] text-outline">HIGH_SCORE</p>
<p class="font-display-score text-body-md text-secondary tracking-tight">4500</p>
</div>
<button class="w-10 h-10 rounded-lg flex items-center justify-center backdrop-blur-md bg-white/5 border border-white/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</div>
</header>
<!-- Main Game Canvas -->
<main class="relative z-10 w-full h-screen flex flex-col items-center pt-24 pb-80 px-4">
<!-- Score Counter Area -->
<div class="w-full max-w-md mb-6 flex justify-between items-end border-l-2 border-primary/40 pl-4 py-2">
<div>
<span class="font-label-caps text-label-caps text-outline block">CURRENT_SCORE</span>
<span class="font-display-score text-headline-lg text-primary">1240</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-outline block">MULTIPLIER</span>
<span class="font-display-score text-headline-lg text-tertiary">x1.5</span>
</div>
</div>
<!-- 20x20 Game Grid Container -->
<div class="relative w-full aspect-square max-w-[400px] bg-surface-container-lowest/80 border border-white/5 rounded-xl overflow-hidden grid-pattern">
<!-- Snake and Fruit Layer (Simplified visual representation for UI mockup) -->
<div class="absolute inset-0 p-1">
<div class="grid grid-cols-20 grid-rows-20 w-full h-full gap-[1px]">
<!-- Snake Head -->
<div class="col-start-11 row-start-10 bg-primary rounded-sm snake-glow z-20"></div>
<!-- Snake Body Segments -->
<div class="col-start-11 row-start-11 bg-primary/80 rounded-sm m-[1px]"></div>
<div class="col-start-11 row-start-12 bg-primary/70 rounded-sm m-[1px]"></div>
<div class="col-start-10 row-start-12 bg-primary/60 rounded-sm m-[1px]"></div>
<div class="col-start-9 row-start-12 bg-primary/50 rounded-sm m-[1px]"></div>
<div class="col-start-8 row-start-12 bg-primary/40 rounded-sm m-[1px]"></div>
<div class="col-start-8 row-start-11 bg-primary/30 rounded-sm m-[1px]"></div>
<!-- Neon Pink Fruit -->
<div class="col-start-15 row-start-6 bg-secondary-container rounded-full fruit-glow animate-pulse"></div>
</div>
</div>
<!-- Grid Overlay Accents -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none">
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary/40"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary/40"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary/40"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary/40"></div>
</div>
</div>
</main>
<!-- Controls Area -->
<div class="fixed bottom-0 left-0 w-full z-50 h-72 flex flex-col items-center justify-center px-margin-mobile">
<!-- Minimalist D-Pad Container -->
<div class="relative w-48 h-48 bg-[#1e293b]/40 backdrop-blur-xl rounded-full border border-white/5 shadow-2xl flex items-center justify-center">
<!-- Center Core -->
<div class="w-16 h-16 bg-surface-container-highest rounded-full border border-white/10 z-10 flex items-center justify-center">
<div class="w-2 h-2 bg-primary rounded-full shadow-[0_0_10px_#4edea3]"></div>
</div>
<!-- Directional Buttons -->
<!-- UP -->
<button class="absolute top-2 left-1/2 -translate-x-1/2 w-14 h-14 flex items-center justify-center d-pad-active rounded-t-xl">
<span class="material-symbols-outlined text-[32px] text-[#38bdf8]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_up</span>
</button>
<!-- DOWN -->
<button class="absolute bottom-2 left-1/2 -translate-x-1/2 w-14 h-14 flex items-center justify-center d-pad-active rounded-b-xl">
<span class="material-symbols-outlined text-[32px] text-[#38bdf8]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_down</span>
</button>
<!-- LEFT -->
<button class="absolute left-2 top-1/2 -translate-y-1/2 w-14 h-14 flex items-center justify-center d-pad-active rounded-l-xl">
<span class="material-symbols-outlined text-[32px] text-[#38bdf8]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_left</span>
</button>
<!-- RIGHT -->
<button class="absolute right-2 top-1/2 -translate-y-1/2 w-14 h-14 flex items-center justify-center d-pad-active rounded-r-xl">
<span class="material-symbols-outlined text-[32px] text-[#38bdf8]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_right</span>
</button>
<!-- Cross Connector Visuals -->
<div class="absolute inset-8 border border-white/5 rounded-full pointer-events-none"></div>
</div>
<!-- HUD Bottom Bar -->
<div class="mt-4 flex gap-8">
<div class="flex items-center gap-2">
<span class="w-2 h-2 bg-primary rounded-full"></span>
<span class="font-label-caps text-[10px] text-outline">LENGTH: 12</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 bg-secondary rounded-full"></span>
<span class="font-label-caps text-[10px] text-outline">ENERGY: 100%</span>
</div>
</div>
</div>
<!-- Bottom Nav Bar (Shared Component Style) -->
<nav class="fixed bottom-0 left-0 w-full z-[60] flex justify-around items-center px-6 pb-8 pt-4 backdrop-blur-xl bg-surface-container-lowest/40 border-t border-white/10">
<button class="flex items-center justify-center bg-primary/20 text-primary rounded-full p-3 shadow-[0_0_15px_rgba(78,222,163,0.4)] transition-all">
<span class="material-symbols-outlined">sports_esports</span>
</button>
<button class="flex items-center justify-center text-outline p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">leaderboard</span>
</button>
<button class="flex items-center justify-center text-outline p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="flex items-center justify-center text-outline p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</button>
</nav>

            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(15);
                }
            });
        });

</body></html>
